name: Offline verification
on: [push, pull_request, workflow_dispatch]
jobs:
  foundations:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact pinned official archives (explicit network stage)
        run: python tools/verify_pinned_sources.py
      - name: Verify retained historical contract packages (explicit network stage)
        shell: python
        run: |
          import json, sys
          sys.path.insert(0, 'tools')
          from verify_pinned_sources import verify_download
          for candidate in ('candidate43', 'candidate44'):
              with open('evidence/dependencies/'+candidate+'-lock.json', encoding='utf-8') as source:
                  packages = json.load(source)['packages']
              with open('evidence/integration-contracts-'+candidate+'/manifest.json', encoding='utf-8') as source:
                  required = {row['repo'] for row in json.load(source)['files']}
              for package in packages:
                  if package['repo'] in required:
                      verify_download(package)
      - name: Reconstruct current contract inputs (explicit network stage)
        run: python -B tools/capture_integration_contracts.py --from-manifest evidence/consoleport-contracts-candidate44/manifest.json --from-manifest evidence/integration-contracts-20261111/manifest.json
      - name: Reconstruct retained candidate44 integration inputs
        run: python -B tools/capture_integration_contracts.py --lock evidence/dependencies/candidate44-lock.json --from-manifest evidence/integration-contracts-candidate44/manifest.json
      - name: Reconstruct hash-pinned local contract inputs (explicit network stage)
        run: python -B tools/capture_integration_contracts.py --lock evidence/dependencies/candidate43-lock.json --from-manifest evidence/integration-contracts-candidate43/manifest.json --native-manifest evidence/follower-dungeons/2026-10-16/source-manifest.json --native-manifest evidence/follower-dungeons/2026-10-16/proxy-source-manifest.json --native-manifest evidence/follower-dungeons/2026-10-16/candidate41-api-source-manifest.json
      - name: Check maintained documentation and repository skills
        run: python -B tools/check_documentation.py
      - name: Reconstruct isolated Pawn and Immersion experiment inputs
        run: |
          python -B tools/capture_pawn_immersion_experiment.py
          python -B tools/capture_pawn_immersion_experiment.py --runtime
          python -B tools/capture_pawn_immersion_experiment.py --tooltip-repair
          python -B tools/capture_pawn_immersion_experiment.py --updates
          python -B tools/capture_pawn_immersion_experiment.py --forever-immersion
      - run: ./tools/Test-All.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-results
          path: |
            scratch/test-results/
            dependencies/lock.json
            dependencies/pack-exclusions.json
            evidence/dependencies/coverage.json
